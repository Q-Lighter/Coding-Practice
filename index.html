<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Naval Combat - Rule Britannia</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1a66b8;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      padding: 15px;
      border-radius: 6px;
      pointer-events: none;
    }
  </style>
  <!-- Load Three.js Library from CDN so the 3D world can render -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="hud">
    <h3>HMS Victory - 3D Command</h3>
    <p><b>W / S:</b> Sail Speed</p>
    <p><b>A / D:</b> Steer Ship</p>
    <p><b>J / L:</b> Fire Port / Starboard Broadside</p>
    <p><b>Space:</b> Broadside Both Sides</p>
  </div>

  <script>
    // --- THREE.JS TOP-DOWN 3D NAVAL GAME ---

    const container = document.body;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a66b8);
    scene.fog = new THREE.FogExp2(0x1a66b8, 0.00015);

    // Top-Down High-Angle Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
    camera.position.set(0, 1200, 400);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
    sunLight.position.set(500, 1200, 800);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 100;
    sunLight.shadow.camera.far = 3000;
    const d = 1500;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // --- PROCEDURAL WOODEN PLANK TEXTURE GENERATOR ---
    function createPlankTexture(isHull) {
      const canvasTex = document.createElement("canvas");
      canvasTex.width = 512;
      canvasTex.height = 512;
      const ctx = canvasTex.getContext("2d");

      ctx.fillStyle = isHull ? "#4a2c11" : "#c2a378";
      ctx.fillRect(0, 0, 512, 512);

      const plankHeight = 16;
      ctx.strokeStyle = "#241305";
      ctx.lineWidth = 1.5;

      for (let y = 0; y < 512; y += plankHeight) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(512, y);
        ctx.stroke();

        const offset = (y / plankHeight) % 2 === 0 ? 0 : 64;
        for (let x = offset; x < 512; x += 128) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x, y + plankHeight);
          ctx.stroke();

          ctx.fillStyle = "#111";
          ctx.fillRect(x + 2, y + 3, 2, 2);
          ctx.fillRect(x + 2, y + plankHeight - 5, 2, 2);
        }
      }

      const texture = new THREE.CanvasTexture(canvasTex);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(2, 2);
      return texture;
    }

    const hullPlankTex = createPlankTexture(true);
    const deckPlankTex = createPlankTexture(false);

    // --- PROCEDURAL 3D CURVED SHIP MESH CREATOR ---
    function createCurvedShipMesh(isFrench) {
      const shipGroup = new THREE.Group();

      const hullShape = new THREE.Shape();
      hullShape.moveTo(0, -35);
      hullShape.bezierCurveTo(18, -25, 20, 10, 18, 30);
      hullShape.quadraticCurveTo(14, 38, 0, 38);
      hullShape.quadraticCurveTo(-14, 38, -18, 30);
      hullShape.bezierCurveTo(-20, 10, -18, -25, 0, -35);

      const extrudeSettings = {
        steps: 1,
        depth: 18,
        bevelEnabled: true,
        bevelThickness: 3,
        bevelSize: 2,
        bevelSegments: 4
      };

      const hullGeo = new THREE.ExtrudeGeometry(hullShape, extrudeSettings);
      hullGeo.rotateX(Math.PI / 2);

      const mainMat = new THREE.MeshStandardMaterial({
        map: hullPlankTex,
        color: isFrench ? 0x222222 : 0x5c3a21,
        roughness: 0.7
      });

      const hullMesh = new THREE.Mesh(hullGeo, mainMat);
      hullMesh.castShadow = true;
      hullMesh.receiveShadow = true;
      shipGroup.add(hullMesh);

      const deckGeo = new THREE.ShapeGeometry(hullShape);
      const deckMat = new THREE.MeshStandardMaterial({ map: deckPlankTex, roughness: 0.6 });
      const deckMesh = new THREE.Mesh(deckGeo, deckMat);
      deckMesh.rotation.x = -Math.PI / 2;
      deckMesh.position.y = 10;
      shipGroup.add(deckMesh);

      const mastMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.8 });
      const sailMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, side: THREE.DoubleSide, roughness: 0.5 });

      // Triple masts & billowing sails
      [-15, 5, 22].forEach((zPos, index) => {
        const mastGeo = new THREE.CylinderGeometry(1.2, 2, 50 - index * 5, 8);
        const mastMesh = new THREE.Mesh(mastGeo, mastMat);
        mastMesh.position.set(0, 25, zPos);
        mastMesh.castShadow = true;
        shipGroup.add(mastMesh);

        [18, 32].forEach((yPos) => {
          const yardGeo = new THREE.CylinderGeometry(0.8, 0.8, 28 - index * 3, 8);
          yardGeo.rotateZ(Math.PI / 2);
          const yardMesh = new THREE.Mesh(yardGeo, mastMat);
          yardMesh.position.set(0, yPos, zPos);
          shipGroup.add(yardMesh);

          const sailGeo = new THREE.PlaneGeometry(26 - index * 3, 12, 8, 8);
          const pos = sailGeo.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const z = pos.getZ(i);
            const x = pos.getX(i);
            pos.setZ(i, z - Math.sin((x / 26) * Math.PI) * 4);
          }
          sailGeo.computeVertexNormals();

          const sailMesh = new THREE.Mesh(sailGeo, sailMat);
          sailMesh.position.set(0, yPos - 5, zPos - 2);
          sailMesh.castShadow = true;
          shipGroup.add(sailMesh);
        });
      });

      // Flank Cannons
      const cannonMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8 });
      [-20, -10, 0, 10, 20].forEach(zPos => {
        const portGun = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1, 8, 8), cannonMat);
        portGun.rotation.z = Math.PI / 2;
        portGun.position.set(-18, 8, zPos);
        shipGroup.add(portGun);

        const stbdGun = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1, 8, 8), cannonMat);
        stbdGun.rotation.z = -Math.PI / 2;
        stbdGun.position.set(18, 8, zPos);
        shipGroup.add(stbdGun);
      });

      return shipGroup;
    }

    // --- WORLD SETUP ---
    const coastlinePolygons = [
      {
        points: [
          { x: -3500, y: 3200 }, { x: -2500, y: 2800 }, { x: -1700, y: 2500 }, 
          { x: -900, y: 2200 },  { x: 0, y: 2050 },     { x: 1300, y: 2000 },   
          { x: 2400, y: 1550 },  { x: 2300, y: 1100 },  { x: 1750, y: 900 },   
          { x: 2500, y: -350 },  { x: 1450, y: -950 },  { x: -450, y: -3100 }, 
          { x: -2800, y: -1100 },{ x: -3100, y: 0 },     { x: -1700, y: 800 }
        ]
      }
    ];

    function create3DCoastline() {
      coastlinePolygons.forEach(coast => {
        const shape = new THREE.Shape();
        coast.points.forEach((pt, idx) => {
          if (idx === 0) shape.moveTo(pt.x, pt.y);
          else shape.lineTo(pt.x, pt.y);
        });

        const extrudeSettings = { depth: 80, bevelEnabled: true, bevelThickness: 10 };
        const landGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        landGeo.rotateX(Math.PI / 2);

        const landMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.9 });
        const landMesh = new THREE.Mesh(landGeo, landMat);
        landMesh.position.y = -10;
        landMesh.receiveShadow = true;
        scene.add(landMesh);
      });
    }
    create3DCoastline();

    const oceanGeo = new THREE.PlaneGeometry(10000, 10000, 64, 64);
    const oceanMat = new THREE.MeshStandardMaterial({ color: 0x1a66b8, roughness: 0.1, metalness: 0.8 });
    const oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
    oceanMesh.rotation.x = -Math.PI / 2;
    oceanMesh.position.y = 0;
    oceanMesh.receiveShadow = true;
    scene.add(oceanMesh);

    // --- PLAYER & CONTROLS ---
    const playerMesh = createCurvedShipMesh(false);
    scene.add(playerMesh);

    const player = {
      mesh: playerMesh,
      x: -700,
      z: 2900,
      speed: 0,
      maxSpeed: 2.5,
      angle: Math.PI / 2,
      turnSpeed: 0.035,
      sailSetting: 1,
      health: 120,
      maxHealth: 120,
      cooldownLeft: 0,
      cooldownRight: 0
    };

    const cannonballs = [];
    const keys = {};

    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      keys[k] = true;

      if (k === "w" && player.sailSetting < 2) player.sailSetting++;
      if (k === "s" && player.sailSetting > -1) player.sailSetting--;

      if (k === "j" || e.key === "ArrowLeft") fireBroadside("left");
      if (k === "l" || e.key === "ArrowRight") fireBroadside("right");
      if (e.key === " " || k === "k") fireBroadside("both");
    });

    window.addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    function fireBroadside(side) {
      const ballSpeed = 12.0;

      function spawnSideVolley(isPort) {
        const flankAngle = player.angle + (isPort ? -Math.PI / 2 : Math.PI / 2);
        const vx = Math.sin(flankAngle) * ballSpeed;
        const vz = Math.cos(flankAngle) * ballSpeed;

        [-15, -5, 5, 15].forEach(offsetZ => {
          const ballGeo = new THREE.SphereGeometry(2, 8, 8);
          const ballMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
          const ballMesh = new THREE.Mesh(ballGeo, ballMat);

          const spawnX = player.x + Math.sin(player.angle) * offsetZ + Math.sin(flankAngle) * 20;
          const spawnZ = player.z + Math.cos(player.angle) * offsetZ + Math.cos(flankAngle) * 20;

          ballMesh.position.set(spawnX, 8, spawnZ);
          scene.add(ballMesh);

          cannonballs.push({
            mesh: ballMesh,
            vx: vx,
            vz: vz,
            life: 70
          });
        });
      }

      if ((side === "left" || side === "both") && player.cooldownLeft <= 0) {
        spawnSideVolley(true);
        player.cooldownLeft = 30;
      }
      if ((side === "right" || side === "both") && player.cooldownRight <= 0) {
        spawnSideVolley(false);
        player.cooldownRight = 30;
      }
    }

    // --- GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      if (player.cooldownLeft > 0) player.cooldownLeft--;
      if (player.cooldownRight > 0) player.cooldownRight--;

      if (keys["a"]) player.angle -= player.turnSpeed;
      if (keys["d"]) player.angle += player.turnSpeed;

      let targetSpeed = 0;
      if (player.sailSetting === 1) targetSpeed = player.maxSpeed * 0.5;
      if (player.sailSetting === 2) targetSpeed = player.maxSpeed;
      if (player.sailSetting === -1) targetSpeed = -player.maxSpeed * 0.3;

      player.speed += (targetSpeed - player.speed) * 0.05;

      player.x += Math.sin(player.angle) * player.speed;
      player.z += Math.cos(player.angle) * player.speed;

      player.mesh.position.set(player.x, 0, player.z);
      player.mesh.rotation.y = player.angle;

      camera.position.x = player.x;
      camera.position.z = player.z + 400;
      camera.lookAt(player.x, 0, player.z);

      for (let i = cannonballs.length - 1; i >= 0; i--) {
        const b = cannonballs[i];
        b.mesh.position.x += b.vx;
        b.mesh.position.z += b.vz;
        b.life--;

        if (b.life <= 0) {
          scene.remove(b.mesh);
          cannonballs.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
