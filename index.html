<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Naval Combat - Rule Britannia</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0d3b66;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      color: white;
      background: rgba(0, 0, 0, 0.75);
      padding: 15px;
      border-radius: 6px;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="hud">
    <h3>HMS Victory - 3D Command</h3>
    <p><b>W / S:</b> Sail Speed (Half / Full / Reverse)</p>
    <p><b>A / D:</b> Steer Ship</p>
    <p><b>J / L:</b> Fire Port / Starboard Broadside</p>
    <p><b>Space:</b> Broadside Both Sides</p>
  </div>

  <script>
    // --- THREE.JS TOP-DOWN 3D NAVAL GAME (MOVEMENT RESTORED) ---

    const container = document.body;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x104f8a);

    // Optimized Top-Down Isometric Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 15000);
    camera.position.set(0, 450, 250);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- CLEAN LIGHTING SETUP ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
    sunLight.position.set(300, 800, 500);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    scene.add(sunLight);

    // --- PROCEDURAL 3D DETAILED SHIP MODEL ---
    function createDetailedShip(isFrench) {
      const shipGroup = new THREE.Group();

      const hullMat = new THREE.MeshStandardMaterial({
        color: isFrench ? 0x1f1f1f : 0x4a2e18,
        roughness: 0.6,
        metalness: 0.1
      });

      // Copper bottom hull
      const copperGeo = new THREE.BoxGeometry(36, 14, 90);
      const copperMat = new THREE.MeshStandardMaterial({ color: 0xb87333, roughness: 0.5 });
      const copperMesh = new THREE.Mesh(copperGeo, copperMat);
      copperMesh.position.set(0, 4, 0);
      copperMesh.castShadow = true;
      shipGroup.add(copperMesh);

      // Main Hull Body
      const hullGeo = new THREE.BoxGeometry(40, 22, 96);
      const hullMesh = new THREE.Mesh(hullGeo, hullMat);
      hullMesh.position.set(0, 18, 0);
      hullMesh.castShadow = true;
      shipGroup.add(hullMesh);

      // Gun Deck Stripes
      const stripeMat = new THREE.MeshStandardMaterial({ color: isFrench ? 0xfbc02d : 0xdddddd });
      const stripeGeo1 = new THREE.BoxGeometry(42, 4, 98);
      const stripe1 = new THREE.Mesh(stripeGeo1, stripeMat);
      stripe1.position.set(0, 16, 0);
      shipGroup.add(stripe1);

      // Wooden Deck
      const deckGeo = new THREE.BoxGeometry(38, 2, 90);
      const deckMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.8 });
      const deckMesh = new THREE.Mesh(deckGeo, deckMat);
      deckMesh.position.set(0, 30, 0);
      shipGroup.add(deckMesh);

      // Triple Masts & Square Sails
      const mastMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.8 });
      const sailMat = new THREE.MeshStandardMaterial({ color: 0xfafafa, side: THREE.DoubleSide, roughness: 0.5 });

      [-22, 0, 25].forEach((zPos, idx) => {
        const mastHeight = 70 - idx * 8;
        const mastGeo = new THREE.CylinderGeometry(1.5, 2.2, mastHeight, 8);
        const mastMesh = new THREE.Mesh(mastGeo, mastMat);
        mastMesh.position.set(0, mastHeight / 2 + 30, zPos);
        mastMesh.castShadow = true;
        shipGroup.add(mastMesh);

        [35, 55].forEach(yHeight => {
          if (yHeight < mastHeight + 20) {
            const sailGeo = new THREE.BoxGeometry(34 - idx * 4, 16, 1.5);
            const sailMesh = new THREE.Mesh(sailGeo, sailMat);
            sailMesh.position.set(0, yHeight, zPos);
            sailMesh.castShadow = true;
            shipGroup.add(sailMesh);
          }
        });
      });

      // Flank Cannons
      const cannonMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8 });
      [-30, -15, 0, 15, 30].forEach(zPos => {
        const portGun = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1, 10, 8), cannonMat);
        portGun.rotation.z = Math.PI / 2;
        portGun.position.set(-22, 20, zPos);
        shipGroup.add(portGun);

        const stbdGun = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1, 10, 8), cannonMat);
        stbdGun.rotation.z = -Math.PI / 2;
        stbdGun.position.set(22, 20, zPos);
        shipGroup.add(stbdGun);
      });

      // National Flag at Stern
      const flagGeo = new THREE.BoxGeometry(12, 8, 1);
      const flagMat = new THREE.MeshBasicMaterial({ color: isFrench ? 0x0d47a1 : 0xffffff });
      const flagMesh = new THREE.Mesh(flagGeo, flagMat);
      flagMesh.position.set(0, 65, -46);
      shipGroup.add(flagMesh);

      shipGroup.scale.set(1.2, 1.2, 1.2);
      return shipGroup;
    }

    // --- OCEAN FLOOR & WATER PLANE ---
    const oceanGeo = new THREE.PlaneGeometry(15000, 15000, 32, 32);
    const oceanMat = new THREE.MeshStandardMaterial({ color: 0x1a66b8, roughness: 0.2, metalness: 0.5 });
    const oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
    oceanMesh.rotation.x = -Math.PI / 2;
    oceanMesh.position.y = -5;
    scene.add(oceanMesh);

    // --- PLAYER CREATION ---
    const playerMesh = createDetailedShip(false);
    scene.add(playerMesh);

    const player = {
      mesh: playerMesh,
      x: 0,
      z: 0,
      speed: 0,
      maxSpeed: 2.5,
      angle: 0,
      turnSpeed: 0.035,
      sailSetting: 1, // Default half sail so it moves immediately
      health: 120,
      maxHealth: 120,
      cooldownLeft: 0,
      cooldownRight: 0
    };

    const cannonballs = [];
    const keys = {};

    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      keys[e.key] = true;

      // Sail controls
      if (k === "w" && player.sailSetting < 2) player.sailSetting++;
      if (k === "s" && player.sailSetting > -1) player.sailSetting--;

      if (k === "j" || e.key === "ArrowLeft") fireBroadside("left");
      if (k === "l" || e.key === "ArrowRight") fireBroadside("right");
      if (e.key === " " || k === "k") fireBroadside("both");
    });

    window.addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false;
      keys[e.key] = false;
    });

    // --- PRECISE FLANK CANNON FIRING ---
    function fireBroadside(side) {
      const ballSpeed = 14.0;

      function spawnSideVolley(isPort) {
        const flankAngle = player.angle + (isPort ? -Math.PI / 2 : Math.PI / 2);
        const vx = Math.sin(flankAngle) * ballSpeed;
        const vz = Math.cos(flankAngle) * ballSpeed;

        [-25, -12, 0, 12, 25].forEach(offsetZ => {
          const ballGeo = new THREE.SphereGeometry(2.5, 8, 8);
          const ballMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
          const ballMesh = new THREE.Mesh(ballGeo, ballMat);

          const spawnX = player.x + Math.sin(player.angle) * offsetZ + Math.sin(flankAngle) * 26;
          const spawnZ = player.z + Math.cos(player.angle) * offsetZ + Math.cos(flankAngle) * 26;

          ballMesh.position.set(spawnX, 20, spawnZ);
          scene.add(ballMesh);

yny = {
            mesh: ballMesh,
            vx: vx,
            vz: vz,
            life: 80
          };
          cannonballs.push(yny);
        });
      }

      if ((side === "left" || side === "both") && player.cooldownLeft <= 0) {
        spawnSideVolley(true);
        player.cooldownLeft = 25;
      }
      if ((side === "right" || side === "both") && player.cooldownRight <= 0) {
        spawnSideVolley(false);
        player.cooldownRight = 25;
      }
    }

    // --- GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      if (player.cooldownLeft > 0) player.cooldownLeft--;
      if (player.cooldownRight > 0) player.cooldownRight--;

      // Steering
      if (keys["a"]) player.angle += player.turnSpeed;
      if (keys["d"]) player.angle -= player.turnSpeed;

      // Speed control via W/S sail settings
      let targetSpeed = 0;
      if (player.sailSetting === 1) targetSpeed = player.maxSpeed * 0.5;
      if (player.sailSetting === 2) targetSpeed = player.maxSpeed;
      if (player.sailSetting === -1) targetSpeed = -player.maxSpeed * 0.3;

      player.speed += (targetSpeed - player.speed) * 0.05;

      // Forward movement vector aligned with ship heading
      player.x += Math.sin(player.angle) * player.speed;
      player.z += Math.cos(player.angle) * player.speed;

      player.mesh.position.set(player.x, 0, player.z);
      player.mesh.rotation.y = player.angle;

      // Smooth Camera tracking directly above player
      camera.position.x = player.x;
      camera.position.z = player.z + 350;
      camera.lookAt(player.x, 0, player.z);

      for (let i = cannonballs.length - 1; i >= 0; i--) {
        const b = cannonballs[i];
        b.mesh.position.x += b.vx;
        b.mesh.position.z += b.vz;
        b.life--;

        if (b.life <= 0) {
          scene.remove(b.mesh);
          cannonballs.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
